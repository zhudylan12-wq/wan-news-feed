name: Refresh Wan news
on:
  schedule:
    - cron: '17 0,12 * * *' # 08:17 and 20:17, UTC+8
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect.py', 'tests/**', '.github/workflows/news.yml', 'public/index.html']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wan-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test collector
        run: python3 -m unittest discover -s tests -v
      - name: Fetch public news metadata
        run: python3 collect.py
      - name: Save successful snapshot
        run: |
          git config user.name 'wan-news-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public news snapshot'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
